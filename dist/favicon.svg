<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Circular clip to guarantee pure circular silhouette -->
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="48" />
    </clipPath>
    <!-- Crimson cyber glow -->
    <radialGradient id="bd-glow" cx="62%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2638" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#070E17" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Circular Masked Graphic -->
  <g clip-path="url(#circle-clip)">
    <!-- Dark Circular Background for light and dark browser tabs -->
    <circle cx="50" cy="50" r="48" fill="#070e17" />
    <circle cx="50" cy="50" r="48" fill="url(#bd-glow)" />

    <!-- Centered BD Monogram -->
    <g transform="translate(11.24, 16.56) scale(0.76)">
      <!-- Left White B Shape -->
      <path
        d="M12 12 H42 C54 12 62 18 62 28 C62 35 57 40 48 42 C59 44 65 51 65 60 C65 70 55 76 42 76 H12 Z"
        fill="#FFFFFF"
      />
      <!-- Cutouts in B -->
      <path
        d="M26 24 H39 C44 24 48 26 48 30 C48 34 44 36 39 36 H26 Z"
        fill="#070e17"
      />
      <path
        d="M26 48 H41 C47 48 51 51 51 56 C51 61 47 64 41 64 H26 Z"
        fill="#070e17"
      />

      <!-- Right Red Interlocking D Shape -->
      <path
        d="M48 12 H62 C78 12 90 24 90 44 C90 64 78 76 62 76 H48 V64 H60 C71 64 76 55 76 44 C76 33 71 24 60 24 H48 Z"
        fill="#FF2638"
      />
    </g>
  </g>

  <!-- High-contrast Neon Crimson Ring -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="#FF2638" stroke-width="2.5" stroke-opacity="0.75" />
</svg>
